services:
  excel-tools:
    image: python:3.11-slim
    command: >
      sh -c "pip install -r requirements.txt && python3 -m uvicorn app.main:app --host 0.0.0.0 --port 18000"
    working_dir: /app
    volumes:
      - ./excel-agent-tools:/app
    environment:
      - API_KEY=${EXCEL_TOOLS_API_KEY:-local-dev-excel-tools-api-key}
      - EXCEL_TOOLS_API_KEY=${EXCEL_TOOLS_API_KEY:-local-dev-excel-tools-api-key}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ACTIVITY_BASE_URL=${ACTIVITY_BASE_URL:-http://mas-activity:8200}
      - MAX_QUERY_PREVIEW_ROWS=10000
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - mas-activity
    networks:
      - backend
      - egress
  math-service:
    image: python:3.11-slim
    command: >
      sh -c "pip install -r requirements.txt && python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8100"
    working_dir: /app
    volumes:
      - ./fastapi-math-service:/app
    environment:
      - ACTIVITY_BASE_URL=${ACTIVITY_BASE_URL:-http://mas-activity:8200}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - mas-activity
    networks:
      - backend
      - egress
  schedule-builder:
    image: python:3.11-slim
    command: >
      sh -c "apt-get update -qq && apt-get install -y -qq --no-install-recommends nodejs >/dev/null && pip install -r requirements.txt && python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8090"
    working_dir: /app
    volumes:
      - ./schedule-builder-service:/app
      - ./n8n/templates:/templates:ro
    environment:
      - ACTIVITY_BASE_URL=${ACTIVITY_BASE_URL:-http://mas-activity:8200}
      - SCHEDULE_TEMPLATES=/templates
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - mas-activity
    networks:
      - backend
      - egress
  mas-activity:
    image: python:3.11-slim
    command: >
      sh -c "pip install -r requirements.txt && python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8200"
    working_dir: /app
    volumes:
      - ./mas-activity-service:/app
      - ./n8n/rag:/rag
    environment:
      - ORCHESTRATOR_WEBHOOK_URL=http://n8n:5678/webhook/mas-orchestrator-step
      - CONTROL_PLANE_PROXY_URL=http://n8n:5678/webhook/mas-control-plane
      - CONTROL_PLANE_PROXY_AUTH_HEADER=${CONTROL_PLANE_PROXY_AUTH_HEADER:-Authorization}
      - CONTROL_PLANE_PROXY_AUTH_VALUE=${CONTROL_PLANE_PROXY_AUTH_VALUE:-local-orch-inbound}
      - ORCHESTRATOR_AUTH_HEADER=${ORCHESTRATOR_AUTH_HEADER:-Authorization}
      - ORCHESTRATOR_AUTH_VALUE=${ORCHESTRATOR_AUTH_VALUE:-local-orch-inbound}
      - N8N_BASE_URL=http://n8n:5678
      - KNOWLEDGE_INGEST_URL=http://n8n:5678/webhook/mas-knowledge-ingest
      - ORCHESTRATOR_WORKFLOW_ID=e9bbdb6e-3b7c-5dc0-851a-30bd9f2eb0d6
      - HITL_MODE=n8n_rest
      - ACTIVITY_TLS_VERIFY=${ACTIVITY_TLS_VERIFY:-true}
      - ACTIVITY_CA_BUNDLE=${ACTIVITY_CA_BUNDLE:-}
      - ACTIVITY_STATE_PATH=/app/data/activity_state.json
      - MAS_KNOWLEDGE_CORPUS=/rag/excel-agent-operating-guide.documents.json
    depends_on:
      n8n:
        condition: service_healthy
    networks:
      - backend
      - egress
  postgres:
    image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
    - 127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    cpus: ${POSTGRES_CPUS:-2.0}
    pids_limit: 256
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
    - backend
    - egress
  n8n:
    image: n8nio/n8n:2.30.8@sha256:11524034450080bd0032754892b23ff20be43d72cf320ce75640f7c5475fdca8
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:5678/healthz || wget -q -O /dev/null
        http://127.0.0.1:5678/healthz/ || exit 1
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: '5432'
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_USER_MANAGEMENT_JWT_SECRET:?Set N8N_USER_MANAGEMENT_JWT_SECRET
        in .env}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_PORT: 5678
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678/}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-168}
      EXECUTIONS_DATA_SAVE_ON_ERROR: ${EXECUTIONS_DATA_SAVE_ON_ERROR:-all}
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: ${EXECUTIONS_DATA_SAVE_ON_SUCCESS:-all}
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_TEMPLATES_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_PUBLIC_API_DISABLED: 'true'
      N8N_COMMUNITY_PACKAGES_ENABLED: 'false'
      N8N_UNVERIFIED_PACKAGES_ENABLED: 'false'
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?Set N8N_RUNNERS_AUTH_TOKEN
        in .env}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_BROKER_PORT: 5679
      N8N_RUNNERS_TASK_TIMEOUT: ${N8N_RUNNERS_TASK_TIMEOUT:-120}
      N8N_RUNNERS_MAX_CONCURRENCY: ${N8N_RUNNERS_MAX_CONCURRENCY:-10}
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: ${N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES:-268435456}
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: ${N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES:-1000}
      N8N_NODES_EXCLUDE: n8n-nodes-base.executeCommand, n8n-nodes-base.localFileTrigger,
        n8n-nodes-base.e2eTest, n8n-nodes-base.dynamicCredentialCheck, n8n-nodes-base.readWriteFile
      NODE_OPTIONS: ${N8N_NODE_OPTIONS:---max-old-space-size=1536}
    volumes:
    - n8n_data:/home/node/.n8n
    - ./n8n/workflows:/workflows:ro
    mem_limit: ${N8N_MEMORY_LIMIT:-2g}
    cpus: ${N8N_CPUS:-2.0}
    pids_limit: 512
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    ports:
    - 127.0.0.1:${N8N_HOST_PORT:-5678}:5678
    extra_hosts:
    - host.docker.internal:host-gateway
    networks:
    - backend
    - egress
    - ingress
  n8n-runners:
    image: n8nio/runners:2.30.8@sha256:dd8531c425cd2c60481cafcb145a8c810f628f176bcb8d41f4c75d79272f7d2a
    restart: unless-stopped
    depends_on:
    - n8n
    environment:
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?Set N8N_RUNNERS_AUTH_TOKEN
        in .env}
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_TASK_TIMEOUT: ${N8N_RUNNERS_TASK_TIMEOUT:-120}
      N8N_RUNNERS_MAX_CONCURRENCY: ${N8N_RUNNERS_MAX_CONCURRENCY:-10}
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: 0
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=${N8N_RUNNERS_TMPFS_SIZE:-128m}
    mem_limit: ${N8N_RUNNERS_MEMORY_LIMIT:-512m}
    cpus: ${N8N_RUNNERS_CPUS:-1.0}
    pids_limit: 256
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - sh
      - -c
      - wget -q -O - http://127.0.0.1:5680/healthz >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
    - backend
volumes:
  postgres_data: null
  n8n_data: null
  excel_sessions: null
  activity_data: null
networks:
  backend:
    internal: true
  egress: null
  ingress: null
