services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

  excel-tools:
    build:
      context: ./excel-agent-tools
      target: runtime
    restart: unless-stopped
    environment:
      API_KEY: ${EXCEL_TOOLS_API_KEY:?Set EXCEL_TOOLS_API_KEY in .env}
      SESSION_DIR: /data/sessions
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-200}
      MAX_PREVIEW_ROWS: 100
      MAX_QUERY_PREVIEW_ROWS: 100
    volumes:
      - excel_sessions:/data/sessions
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:${EXCEL_TOOLS_HOST_PORT:-8000}:8000"

  n8n:
    image: n8nio/n8n:2.30.8
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      excel-tools:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_USER_MANAGEMENT_JWT_SECRET:?Set N8N_USER_MANAGEMENT_JWT_SECRET in .env}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_PORT: 5678
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678/}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      # The imported Code node reads only the listed QWEN/Excel service env vars.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      EXCEL_TOOLS_URL: http://excel-tools:8000/api/v1
      EXCEL_TOOLS_API_KEY: ${EXCEL_TOOLS_API_KEY:?Set EXCEL_TOOLS_API_KEY in .env}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://codex.sale/v1}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_MODEL: ${QWEN_MODEL:-qwen3.6-plus}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    ports:
      - "127.0.0.1:${N8N_HOST_PORT:-5678}:5678"

volumes:
  postgres_data:
  n8n_data:
  excel_sessions:
